[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=900"

[images]
  remote_images = ["https://visitgraysharbor\\.com/.*", "https://www\\.seabrookwa\\.com/.*", "https://images\\.squarespace-cdn\\.com/.*"]

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[functions]
  directory = "netlify/functions"
  included_files = ["assets/planner-core.js"]

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
